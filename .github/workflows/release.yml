name: Build e Commit Instaladores na Raiz (.NET 10)

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-linux-packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Instalar dependências de empacotamento (fpm, rpm, fuse)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libfuse2 wget file
          sudo gem install --no-document fpm

      - name: Publicar aplicação Linux x64 (.NET 10)
        run: |
          dotnet publish FixMaster/FixMaster.csproj -c Release -r linux-x64 --self-contained true -o releases/linux-x64
          chmod +x releases/linux-x64/FixMaster

      - name: Preparar estrutura de instalação Linux (/opt/fixmaster)
        run: |
          mkdir -p pkg_root/opt/fixmaster
          mkdir -p pkg_root/usr/bin
          mkdir -p pkg_root/usr/share/applications
          mkdir -p pkg_root/usr/share/icons/hicolor/scalable/apps
          mkdir -p releases/installers

          cp -r releases/linux-x64/* pkg_root/opt/fixmaster/
          ln -s /opt/fixmaster/FixMaster pkg_root/usr/bin/fixmaster

          cat << 'EOF' > pkg_root/usr/share/applications/fixmaster.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=FixMaster
          Comment=Sistema de gestão FixMaster
          Exec=/opt/fixmaster/FixMaster
          Icon=fixmaster
          Terminal=false
          Categories=Utility;
          EOF

          cat << 'EOF' > pkg_root/usr/share/icons/hicolor/scalable/apps/fixmaster.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="48" fill="#1e293b"/>
            <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="96" font-weight="bold">FM</text>
          </svg>
          EOF

      - name: Gerar .DEB (Ubuntu / Debian / Mint) e .RPM (Fedora / RHEL / openSUSE)
        run: |
          fpm -s dir -t deb -n fixmaster -v 1.0.0 -a amd64 \
            --description "Sistema de gestão FixMaster" \
            -C pkg_root \
            -p releases/installers/fixmaster-1.0.0-linux-x64.deb \
            opt usr

          fpm -s dir -t rpm -n fixmaster -v 1.0.0 -a x86_64 \
            --description "Sistema de gestão FixMaster" \
            -C pkg_root \
            -p releases/installers/fixmaster-1.0.0-linux-x86_64.rpm \
            opt usr

      - name: Gerar .AppImage (Universal para todas as distros)
        run: |
          mkdir -p AppDir/usr/bin
          cp -r releases/linux-x64/* AppDir/usr/bin/
          cp pkg_root/usr/share/applications/fixmaster.desktop AppDir/FixMaster.desktop
          cp pkg_root/usr/share/icons/hicolor/scalable/apps/fixmaster.svg AppDir/fixmaster.svg
          sed -i 's|Exec=/opt/fixmaster/FixMaster|Exec=FixMaster|g' AppDir/FixMaster.desktop

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/FixMaster" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir releases/installers/FixMaster-Linux-x86_64.AppImage

      - uses: actions/upload-artifact@v5
        with:
          name: installers-linux
          path: releases/installers/*

  build-windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publicar Windows x64
        run: |
          dotnet publish FixMaster/FixMaster.csproj -c Release -r win-x64 --self-contained true -o releases/win-x64

      - name: Gerar instalador .exe
        run: |
          choco install innosetup -y
          mkdir releases\installers
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_win.iss

      - uses: actions/upload-artifact@v5
        with:
          name: installer-windows-exe
          path: releases/installers/*.exe
  build-macos-dmg:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            arch_name: AppleSilicon
          - rid: osx-x64
            arch_name: Intel

    steps:
      - uses: actions/checkout@v5

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publicar binário macOS (${{ matrix.rid }})
        run: |
          dotnet publish FixMaster/FixMaster.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o releases/${{ matrix.rid }}

      - name: Empacotar em .app e gerar .dmg
        run: |
          mkdir -p "releases/dmg_stage/FixMaster.app/Contents/MacOS"
          mkdir -p "releases/dmg_stage/FixMaster.app/Contents/Resources"
          mkdir -p "releases/installers"

          cp -R releases/${{ matrix.rid }}/* "releases/dmg_stage/FixMaster.app/Contents/MacOS/"
          chmod +x "releases/dmg_stage/FixMaster.app/Contents/MacOS/FixMaster"

          cat << 'EOF' > "releases/dmg_stage/FixMaster.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>FixMaster</string>
            <key>CFBundleDisplayName</key>
            <string>FixMaster</string>
            <key>CFBundleIdentifier</key>
            <string>com.capelaripedro.fixmaster</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>FixMaster</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          ln -s /Applications "releases/dmg_stage/Applications"
          hdiutil create -volname "FixMaster" -srcfolder "releases/dmg_stage" -ov -format UDZO "releases/installers/FixMaster-macOS-${{ matrix.arch_name }}.dmg"

      - uses: actions/upload-artifact@v5
        with:
          name: installer-macos-${{ matrix.arch_name }}
          path: releases/installers/*.dmg

  commit-to-root:
    needs: [build-linux-packages, build-windows-exe, build-macos-dmg]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Baixar todos os instaladores
        uses: actions/download-artifact@v5
        with:
          path: temp_dist

      - name: Substituir instaladores na raiz do repositório
        run: |
          rm -f *.exe *.rpm *.deb *.AppImage *.dmg
          find temp_dist -type f \( -name "*.exe" -o -name "*.rpm" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp {} . \;
          rm -rf temp_dist

      - name: Commit e Push na raiz da main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.exe *.rpm *.deb *.AppImage *.dmg
          if ! git diff --staged --quiet; then
            git commit -m "build: atualiza instaladores na raiz [skip ci]"
            git push origin main
          fi